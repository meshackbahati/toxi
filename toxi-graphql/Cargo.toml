[package]
name = "toxi-graphql"
version = "3.0.0"
edition = "2021"
authors = ["Meshack Bahati Ouma <bahatikylemeshack@gmail.com>"]
description = "GraphQL integration for Toxi web framework with schema generation and resolvers"
license = "MIT OR Apache-2.0"
repository = "https://github.com/meshackbahati/toxi"
keywords = ["graphql", "api", "web", "schema"]
categories = ["web-programming", "api-bindings"]

[dependencies]
async-trait = "0.1.89"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["full"] }
thiserror = "2.0.17"
chrono = "0.4.42"
juniper = "0.15.12"
hyper = { version = "1.0", features = ["full"] }
futures = "0.3"
http-body-util = "0.1.3"

# Toxi dependencies
toxi-core = { version = "3.0.0", path = "../toxi-core" }
toxi-db = { version = "3.0.0", path = "../toxi-db", optional = true }

[features]
default = ["database"]
database = ["dep:toxi-db"]
