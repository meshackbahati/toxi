[package]
name = "toxi-storage"
version = "3.0.0"
edition = "2021"
authors = ["Meshack Bahati Ouma <bahatikylemeshack@gmail.com>"]
description = "File storage for Toxi with local and S3 backends"
license = "MIT OR Apache-2.0"
repository = "https://github.com/meshackbahati/toxi"
keywords = ["storage", "file", "s3", "upload", "web"]
categories = ["filesystem", "web-programming"]

[dependencies]
tokio = { version = "1.48.0", features = ["full"] }
async-trait = "0.1.89"
thiserror = "2.0.17"
uuid = { version = "1.11.0", features = ["v4"] }
mime_guess = "2.0.5"
bytes = "1.11.0"
once_cell = "1.21.4"

[dependencies.aws-sdk-s3]
version = "1.91.0"
optional = true

[dependencies.aws-config]
version = "1.7.0"
optional = true

[features]
default = ["s3"]
s3 = ["aws-sdk-s3", "aws-config"]
