[package]
name = "toxi-testing"
version = "3.1.0"
edition = "2021"
authors = ["Meshack Bahati Ouma <bahatikylemeshack@gmail.com>"]
description = "Testing utilities for the Toxi web framework"
license = "MIT OR Apache-2.0"
repository = "https://github.com/meshackbahati/toxi"
keywords = ["web", "framework", "testing", "http", "async"]
categories = ["web-programming", "development-tools::testing"]

[dependencies]
toxi-core = { path = "../toxi-core", version = "3.1.1-2" }
toxi-db = { path = "../toxi-db", version = "3.1.0" }
tokio = { version = "1.48.0", features = ["full", "test-util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
http = "1.0"
bytes = "1.0"
async-trait = "0.1"
http-body-util = "0.1.3"
tower = "0.5"
thiserror = "2.0"
