name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: moonrepo/setup-rust@v1
        with:
          channel: stable
      - name: Check apps
        run: cargo check --workspace --all-targets
      - name: Test apps
        run: cargo test --workspace

  docker:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - app: taskboard
            dir: apps/fullstack/taskboard
          - app: blog
            dir: apps/fullstack/blog
          - app: shortlink
            dir: apps/api/shortlink
          - app: echo
            dir: apps/serverless/echo
    steps:
      - uses: actions/checkout@v5
      - name: Build ${{ matrix.app }} image
        run: docker build -t ${{ matrix.app }} ${{ matrix.dir }}
