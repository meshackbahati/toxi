[package]
name = "toxi-middleware"
version = "3.0.0"
edition = "2021"
authors = ["Meshack Bahati Ouma <bahatikylemeshack@gmail.com>"]
description = "HTTP middleware for Toxi (CORS, logging, compression, rate limiting)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/meshackbahati/toxi"
keywords = ["middleware", "http", "cors", "logging", "compression"]
categories = ["web-programming"]

[dependencies]
toxi-core = { version = "3.0.0", path = "../toxi-core" }
tower = { version = "0.5.2", features = ["full"] }
tower-http = { version = "0.6.7", features = ["full"] }
tokio = { version = "1.48.0", features = ["full"] }
uuid = { version = "1.11.0", features = ["v4"] }
sha2 = "0.10.9"
base64 = "0.22.1"
rand = "0.9.1"
thiserror = "2.0"
toxi-db = { version = "3.0.0", path = "../toxi-db" }
toxi-utils = { version = "3.0.0", path = "../toxi-utils" }
chrono = "0.4"
http = "1.2.0"
http-body-util = "0.1.0"
bytes = "1.9.0"
hyper = { version = "1.0", features = ["full"] }
