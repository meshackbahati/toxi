<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Toxi Demo{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="/public/images/toxi.svg">
    <link rel="stylesheet" href="/public/css/style.css">
    {% block extra_styles %}{% endblock %}
</head>

<body>
    <div class="container">
        <header>
            <div class="header-content">
                <img src="/public/images/toxi.svg" alt="Toxi" class="header-logo">
                <div>
                    <h1>Toxi Framework</h1>
                    <p>Modern, Fast & Powerful Rust Web Framework</p>
                </div>
            </div>
        </header>

        <nav>
            <a href="/">Home</a>
            <a href="/users">Users</a>
            <a href="/posts">Posts</a>
            <a href="/docs">API Docs</a>
        </nav>

        <main>
            {% block content %}{% endblock %}
        </main>

        <footer>
            <p>Built with ❤️ using <a href="https://github.com/meshackbahati/rust-toxi" target="_blank">Toxi
                    Framework</a> | &copy; 2026</p>
        </footer>
    </div>
    {% block extra_scripts %}{% endblock %}
</body>

</html>
