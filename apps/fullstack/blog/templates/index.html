{% extends "layout.html" %}
{% block content %}
{% for post in posts %}<article><h2><a href="/posts/{{ post.id }}">{{ post.title }}</a></h2><p class="meta">by {{ post.author }}</p></article>{% endfor %}
{% if post_count == 0 %}<div class="empty"><h2>No posts yet</h2><p>Register, log in, and publish the first one.</p></div>{% endif %}
{% endblock %}
