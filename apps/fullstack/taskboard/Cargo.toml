[package]
name = "taskboard"
version = "0.1.0"
edition = "2021"
authors = ["Meshack Bahati Ouma <bahatikylemeshack@gmail.com>"]
description = "Demo application showcasing Toxi features"

[dependencies]
toxi = { version = "3", features = ["full"] }
toxi-core = "3"
toxi-openapi = "3"
toxi-template = { version = "3" }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
cc = "1.5.1"

