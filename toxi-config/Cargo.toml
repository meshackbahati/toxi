[package]
name = "toxi-config"
version = "3.0.0"
edition = "2021"
authors = ["Meshack Bahati Ouma <bahatikylemeshack@gmail.com>"]
description = "Configuration management for the Toxi web framework"
license = "MIT OR Apache-2.0"
repository = "https://github.com/meshackbahati/toxi"
homepage = "https://github.com/meshackbahati/toxi"
documentation = "https://docs.rs/toxi-config"
keywords = ["config", "yaml", "toml", "web", "environment"]
categories = ["config", "web-programming"]

[dependencies]
dotenv = "0.15.0"
num_cpus = "1.17.0"
serde = { version = "1.0.228", features = ["derive"] }
toml = "0.9.8"
serde_yaml = "0.9"
notify = "6.1"
thiserror = "2.0"
