[package]
name = "toxi-openapi"
version = "3.1.0"
edition = "2021"
authors = ["Meshack Bahati Ouma <bahatikylemeshack@gmail.com>"]
description = "OpenAPI/Swagger documentation generation for Toxi"
license = "MIT OR Apache-2.0"
repository = "https://github.com/meshackbahati/toxi"
keywords = ["openapi", "swagger", "api", "documentation", "web"]
categories = ["web-programming", "development-tools"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toxi-core = { version = "3", path = "../toxi-core" }
