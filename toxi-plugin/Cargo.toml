[package]
name = "toxi-plugin"
version = "3.1.0"
edition = "2021"
authors = ["Meshack Bahati Ouma <bahatikylemeshack@gmail.com>"]
description = "Plugin system for Toxi web framework with dynamic loading and extension capabilities"
license = "MIT OR Apache-2.0"
repository = "https://github.com/meshackbahati/toxi"
keywords = ["plugin", "extension", "dynamic", "modular"]
categories = ["web-programming", "config"]

[dependencies]
async-trait = "0.1.89"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["full"] }
thiserror = "2.0.17"
chrono = "0.4.42"
libloading = "0.8.5"

# Toxi dependencies
toxi-core = { version = "3.1.1-2", path = "../toxi-core" }
toxi-config = { version = "3.1.0", path = "../toxi-config" }

[features]
default = []
