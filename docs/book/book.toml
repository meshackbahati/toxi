[book]
authors = ["Meshack Bahati Ouma"]
language = "en"
src = "."
title = "Toxi Documentation - Professional Rust Web Framework"
description = "Comprehensive documentation for Toxi, a high-performance, batteries-included web framework for Rust. Learn about routing, ORM, OpenAPI, real-time features, and more."

[build]
build-dir = "book"

[output.html]
default-theme = "light"
git-repository-url = "https://github.com/meshackbahati/rust-toxi"
edit-url-template = "https://github.com/meshackbahati/rust-toxi/edit/main/docs/book/{path}"
site-url = "https://toxi.rs/docs/book/"
additional-css = ["custom.css"]
additional-js = ["branding.js"]
google-analytics = "G-XXXXXXXXXX"

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
expand = true
heading-split-level = 3

[output.html.playground]
editable = true
copy-js = true

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
expand = true
heading-split-level = 3
